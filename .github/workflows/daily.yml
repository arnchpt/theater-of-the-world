name: Mise à jour quotidienne

on:
  schedule:
    - cron: '30 7 * * *'   # GDELT publie le fichier de la veille vers 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: theater-of-the-world
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collecter GDELT et reconstruire le site
        run: python3 -I pipeline/update.py
      - name: Archiver les agrégats quotidiens et hebdomadaires
        run: |
          git config user.name "theater-of-the-world-bot"
          git config user.email "theater-of-the-world-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Données GDELT au $(date -u -d yesterday +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
